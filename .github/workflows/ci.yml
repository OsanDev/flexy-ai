name: FLEXY AI verification

on:
  push:
    branches:
      - main
      - "build/**"
  pull_request:
    branches:
      - main
      - "build/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flexy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and real MP4 smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install backend dependencies and test tools
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx

      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q app

      - name: Run backend suite, including real MP4 export
        working-directory: backend
        run: python -m pytest -q -rs

  frontend:
    name: Frontend typecheck, timeline tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-reference/apps/web
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Timeline tests
        run: npm run test:timeline

      - name: Production build
        run: npm run build

  containers:
    name: Docker Compose configuration and image builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Compose configuration and persistent data mount
        run: |
          docker compose config --quiet
          docker compose config --format json > /tmp/flexy-compose.json
          python -c 'import json; config=json.load(open("/tmp/flexy-compose.json")); mounts=config["services"]["backend"]["volumes"]; assert any(mount["type"] == "volume" and mount["target"] == "/data" for mount in mounts), mounts'

      - name: Build backend and frontend images
        run: docker compose build

  browser:
    name: Playwright browser workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-reference/apps/web
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium and FFmpeg
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python for live API
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Start isolated live backend
        working-directory: backend
        env:
          FLEXY_DATA_DIR: /tmp/flexy-live-e2e-data
          FLEXY_CORS_ORIGINS: http://127.0.0.1:4173
          FLEXY_COOKIE_SECURE: "false"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/flexy-live-backend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail http://127.0.0.1:8000/api/health; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/flexy-live-backend.log
          exit 1

      - name: Run mocked and live browser workflows
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
        run: npm run test:e2e

      - name: Print live backend diagnostics
        if: always()
        run: tail -n 250 /tmp/flexy-live-backend.log || true
